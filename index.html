    <script>
      // Apply the saved theme before the first paint, so the page never flashes the wrong colours. 'auto' follows the OS.
      (function () {
        var pref = 'auto';
        try { pref = JSON.parse(localStorage.getItem('wc:theme')) || 'auto'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
